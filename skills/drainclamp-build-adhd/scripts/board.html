<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="data:,">
<title>DrainClamp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Tokens: .grok/product-ui/theme.md (locked round 6). One committed dark mode. */
:root{
  --bg:#0e0f12; --panel:#15161a; --raise:#1b1d22; --hover:#1f2127; --line:#24262d; --line-2:#2f323a;
  --text:#ecedf0; --text-2:#a4a7b0; --text-3:#6e727c;
  --accent:#3987e5; --warn:#fab219; --good:#0ca30c; --info:#3987e5; --neutral:#5b5f68; --track:#26282f; --bad:#e66767;
  --s1:#3987e5; --s2:#d95926;
  --shadow:0 12px 40px rgba(0,0,0,.45);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.5 "Inter",system-ui,sans-serif;font-feature-settings:"cv11","ss01";-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:left}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--text-3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
code,.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12.5px}
h1,h2,h3,h4,p{margin:0}
#tip{position:fixed;z-index:200;pointer-events:none;background:#fff;color:#16181d;font:500 12px/1.4 "Inter",sans-serif;padding:6px 9px;border-radius:6px;box-shadow:0 6px 20px rgba(0,0,0,.3);white-space:nowrap;display:none}
#tip b{font-weight:600}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;background:#fff;color:#16181d;padding:10px 14px;border-radius:9px;font-size:13px;box-shadow:0 8px 30px rgba(0,0,0,.35);transition:.2s;z-index:300;pointer-events:none;max-width:min(560px,92vw)}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast.bad{background:#3a1c1c;color:#ffd9d9}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* chrome */
.bar{display:flex;align-items:center;gap:12px;height:52px;padding:0 20px;border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:0;z-index:10}
.logo{display:flex;align-items:center;gap:9px;font-weight:600;font-size:14px}
.logo i{width:18px;height:18px;border-radius:5px;background:var(--accent);display:grid;place-items:center}
.logo i::after{content:"";width:8px;height:8px;border:2px solid #fff;border-radius:50%}
.crumb{color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp{flex:1}
.sync{display:flex;align-items:center;gap:7px;color:var(--text-3);font-size:12.5px;white-space:nowrap}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--good)}
.btn{height:30px;padding:0 12px;border-radius:7px;border:1px solid var(--line-2);background:var(--panel);font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{height:26px;font-size:12.5px;padding:0 10px}
.btn:disabled{opacity:.5;cursor:default}
.input,.select{height:30px;border:1px solid var(--line-2);border-radius:7px;background:var(--bg);color:var(--text);font-size:13px;padding:0 10px}
textarea.input{height:auto;padding:8px 10px;line-height:1.45;resize:vertical}
.app{display:grid;grid-template-columns:300px minmax(0,1fr);height:calc(100vh - 52px)}
.side{border-right:1px solid var(--line);overflow:auto;padding:10px 0 60px}
.main{overflow:auto}
.wrap{max-width:1180px;padding:26px 32px 110px}
.sub{color:var(--text-2);margin-top:4px;font-size:13.5px}
h1{font-size:20px;font-weight:600;letter-spacing:-.01em}

/* side list */
.home{display:flex;align-items:center;gap:10px;margin:0 8px 2px;padding:8px 12px;border-radius:7px;width:calc(100% - 16px);font-weight:500;font-size:13.5px}
.home:hover{background:var(--hover)} .home[aria-current="true"]{background:var(--raise)}
.home span{margin-left:auto;color:var(--text-3);font-weight:400;font-size:12px}
.find{display:block;margin:6px 10px 4px;width:calc(100% - 20px)}
.gh{display:flex;align-items:center;gap:8px;padding:16px 20px 6px;font-size:12px;font-weight:500;color:var(--text-3);width:100%}
.gh b{font-weight:500;margin-left:auto}
button.gh:hover{color:var(--text-2)}
.li{display:grid;grid-template-columns:16px minmax(0,1fr) auto;gap:10px;align-items:center;margin:0 8px;padding:6px 12px;border-radius:7px;width:calc(100% - 16px)}
.li:hover{background:var(--hover)} .li[aria-current="true"]{background:var(--raise);box-shadow:inset 2px 0 0 var(--accent)}
.li .n{font-weight:500;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .w{color:var(--text-3);font-size:12px}
.li svg,.st svg{flex:none}
.li.bad .n{color:var(--bad)}

/* cards, stats, charts */
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px}
.card h3{font-size:13px;font-weight:500;color:var(--text-2)}
.card .hd{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:16px 18px 0}
.card .hd small{color:var(--text-3);font-size:12px}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-top:22px}
.stat{padding:16px 18px}
.stat .l{color:var(--text-2);font-size:13px;font-weight:500}
.stat .v{font-size:28px;font-weight:600;letter-spacing:-.02em;margin-top:6px;line-height:1.1}
.stat .v small{font-size:14px;color:var(--text-3);font-weight:500;margin-left:4px;letter-spacing:0}
.stat .d{font-size:12.5px;color:var(--text-3);margin-top:6px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.up{color:var(--good);font-weight:500} .dn{color:var(--bad);font-weight:500}
.meter{height:6px;border-radius:3px;background:var(--track);margin-top:12px;overflow:hidden}
.meter span{display:block;height:100%;background:var(--accent);border-radius:3px}
.charts{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:12px;margin-top:12px}
.chart{padding:4px 18px 14px}
svg.viz{display:block;width:100%;height:auto;overflow:visible}
.axis{fill:var(--text-3);font:11px "Inter",sans-serif;font-variant-numeric:tabular-nums}
.grid line{stroke:var(--line);stroke-width:1}
.col{fill:var(--accent)} .col.hit{fill:transparent}
.colg:hover .col:not(.hit){filter:brightness(1.2)}
.vhead{display:flex;align-items:center;gap:10px;margin:30px 0 -8px;flex-wrap:wrap}
.vhead h2{font-size:15px;font-weight:600}
.vhead small{color:var(--text-3);font-size:12.5px;margin-left:auto}
.stack{display:flex;gap:2px;height:10px;border-radius:5px;overflow:hidden;margin:16px 18px 0}
.stack span{display:block;height:100%}
.legend{display:grid;grid-template-columns:1fr auto;gap:10px 12px;padding:16px 18px 18px;font-size:13px}
.legend .k{display:flex;align-items:center;gap:8px;color:var(--text-2)}
.legend .k i,.lg2 i{width:9px;height:9px;border-radius:2px;display:inline-block}
.legend .c{font-weight:500;text-align:right}
.lg2{display:flex;gap:16px;padding:10px 18px 0;font-size:12.5px;color:var(--text-2)}
.lg2 span{display:flex;align-items:center;gap:7px}
.hbars{padding:10px 18px 16px;display:grid;gap:9px}
.hbar{display:grid;grid-template-columns:150px 1fr 34px;gap:10px;align-items:center;font-size:12.5px;color:var(--text-2);width:100%}
.hbar span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar .t{height:8px} .hbar .t b{display:block;height:100%;background:var(--accent);border-radius:0 4px 4px 0;min-width:2px}
.hbar .c{color:var(--text);text-align:right;font-weight:500}
.vbars{padding:10px 18px 14px;display:grid;gap:4px}
.vb{display:grid;grid-template-columns:200px minmax(0,1fr) 150px;gap:14px;align-items:center;padding:6px 8px;margin:0 -8px;border-radius:7px;width:calc(100% + 16px)}
.vb:hover{background:var(--hover)}
.vb .nm{font-size:13px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pair{display:grid;gap:2px} .pair .t{height:8px;display:block} .pair .t b{display:block;height:100%;border-radius:0 4px 4px 0;min-width:2px}
.vb .c{text-align:right;font-weight:500;font-size:13px} .vb .c small{display:block;color:var(--text-3);font-weight:400;font-size:11.5px}
.rows .row{display:grid;grid-template-columns:minmax(0,1fr) auto 70px;gap:16px;align-items:center;padding:0 18px;height:48px;border-top:1px solid var(--line);width:100%;font-size:13.5px}
.rows .row:hover{background:var(--hover)}
.rows .row .nm{display:flex;align-items:center;gap:10px;font-weight:500;min-width:0}
.rows .row .nm svg{flex:none}
.rows .row .nm span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rows .row .nm em{font-style:normal;color:var(--text-3);font-weight:400}
.rows .row .r{color:var(--text-3);font-size:12.5px;text-align:right}
.notice{border:1px solid var(--line-2);border-radius:10px;padding:14px 18px;display:flex;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap}
.notice>div{flex:1 1 320px;display:grid;gap:3px}
.notice b{font-weight:500}
.notice span{color:var(--text-3);font-size:12.5px}
.notice.warn{border-color:rgba(250,178,25,.3)}
.empty-state{border:1px dashed var(--line-2);border-radius:10px;padding:18px;color:var(--text-2)}

/* project page */
.detail{max-width:980px;padding:18px 32px 110px}
.back{color:var(--text-3);font-size:12.5px;margin-bottom:14px;display:inline-flex;gap:6px}
.back:hover{color:var(--text)}
.ptop{display:flex;align-items:flex-start;gap:12px}
.ptop h2{font-size:18px;font-weight:600;letter-spacing:-.01em}
.meta{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px;color:var(--text-3);font-size:12.5px;align-items:center}
.st{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--text-2);white-space:nowrap}
.guess{font-size:11px;color:var(--text-3);border:1px dashed var(--line-2);border-radius:4px;padding:0 5px}
.smenu{position:relative;display:inline-flex}
.sbtn{padding:3px 8px;margin:-3px -8px;border-radius:6px}
.sbtn:hover,.sbtn[aria-expanded="true"]{background:var(--hover);color:var(--text)}
.menu{position:absolute;top:calc(100% + 6px);left:-8px;z-index:20;min-width:220px;background:var(--raise);border:1px solid var(--line-2);border-radius:9px;box-shadow:var(--shadow);padding:4px;display:grid}
.menu button{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:6px;font-size:13px}
.menu button:hover{background:var(--hover)}
.menu .ck{margin-left:auto;color:var(--text-3)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.mini{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:20px}
.mini>div{border:1px solid var(--line);border-radius:9px;padding:12px 14px}
.mini .l{color:var(--text-3);font-size:12px}
.mini .v{font-size:20px;font-weight:600;margin-top:2px;letter-spacing:-.01em}
.mini .v small{color:var(--text-3);font-size:14px;font-weight:500}
.sec{margin-top:26px}
.sec>h4{margin:0 0 10px;font-size:12.5px;font-weight:500;color:var(--text-3);display:flex;align-items:center;gap:8px}
.sec>h4 .btn{margin-left:auto}
.badge{font-size:11px;font-weight:500;border-radius:4px;padding:1px 6px}
.badge.draft{color:var(--info);border:1px solid rgba(57,135,229,.35)}
.badge.ok{color:var(--good);border:1px solid rgba(12,163,12,.35)}
.outcome{font-size:16px;line-height:1.5}
.acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
.box{border:1px solid var(--line);border-radius:9px;padding:14px 16px}
.bline{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:flex-end}
.bline .l,.ba .l{display:block;color:var(--text-3);font-size:12px}
.bline b,.ba b{font-size:18px;font-weight:600}
.bline .src{flex:1 1 260px;color:var(--text-3);font-size:12.5px}
.split3{flex-basis:100%;display:flex;gap:2px;height:8px;border-radius:4px;overflow:hidden}
.split3 span{display:block;height:100%}
.ba{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.ba>*{flex:none}
.ba .arr,.ba .mul{color:var(--text-3);padding-bottom:3px;white-space:nowrap}
.ba .btn{margin-left:auto}
.vform{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:12px}
.vform label{display:grid;gap:5px;font-size:12px;color:var(--text-3)}
.vform .full{grid-column:1/-1}
.banner{display:flex;align-items:center;gap:12px;margin-top:18px;padding:12px 14px;border:1px solid var(--line);border-radius:9px;background:var(--raise);font-size:13.5px;color:var(--text-2)}
.banner b{color:var(--text);font-weight:500}
.banner .btn{margin-left:auto}
.next{border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:9px;padding:12px 14px;font-size:14px;line-height:1.5}
.next.run{border-left-color:var(--good)} .next.close{border-left-color:var(--info)} .next.done{border-left-color:var(--neutral)}
.two{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:24px}
.feed{list-style:none;margin:0;padding:0}
.feed li{position:relative;padding:0 0 14px 18px;font-size:13px;color:var(--text-2)}
.feed li::before{content:"";position:absolute;left:3px;top:7px;width:7px;height:7px;border-radius:50%;background:var(--line-2)}
.feed li::after{content:"";position:absolute;left:6px;top:18px;bottom:0;width:1px;background:var(--line)}
.feed li:last-child::after{display:none}
.feed b{display:block;color:var(--text-3);font-weight:500;font-size:12px}
.mls{list-style:none;margin:0;padding:0}
.mls li{display:grid;grid-template-columns:18px 64px 1fr auto;gap:8px;padding:7px 0;border-top:1px solid var(--line);font-size:13px;color:var(--text-2);align-items:start}
.mls li:first-child{border-top:0}
.mls li code{color:var(--text-3)}
.mls li.a{color:var(--text)}
.mls li input{margin:3px 0 0}
.mls li .who{font-size:11.5px;color:var(--text-3)}
.taskform{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:8px;margin:0 0 10px}
details.more{margin-top:26px;border-top:1px solid var(--line);padding-top:14px}
details.more>summary{cursor:pointer;color:var(--text-3);font-size:12.5px;font-weight:500}
table.t{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
table.t th{color:var(--text-3);font-weight:500;font-size:12px;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
table.t td{padding:7px 8px;border-bottom:1px solid var(--line);color:var(--text-2);vertical-align:top}
table.t td.n{text-align:right;font-variant-numeric:tabular-nums}

/* sessions page */
.srow{display:grid;grid-template-columns:70px 110px minmax(0,1fr) 70px 80px 260px;gap:12px;align-items:center;padding:10px 18px;border-top:1px solid var(--line);font-size:13px}
.srow.head{color:var(--text-3);font-size:12px;font-weight:500;border-top:0}
.srow .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text-2)}
.srow .a{display:flex;gap:6px;align-items:center}
.srow .a .select{flex:1;min-width:0}

/* charter form */
.form{margin-top:18px}
.fsec{display:grid;grid-template-columns:260px minmax(0,1fr);gap:24px;padding:22px 0;border-top:1px solid var(--line)}
.fsec .k h3{font-size:14px;font-weight:600;display:flex;gap:8px;align-items:baseline}
.fsec .k h3 span{color:var(--text-3);font-weight:500}
.fsec .k p{color:var(--text-3);font-size:12.5px;margin-top:6px}
.fsec .k .feeds{font-size:11.5px}
.fld{display:grid;gap:6px;margin-bottom:14px}
.fld label,.fld .lbl{font-size:13px;font-weight:500}
.fld em{font-style:normal;color:var(--text-3);font-weight:400;margin-left:8px;font-size:12px}
.fld .hint{color:var(--text-3);font-size:12.5px}
.fld input[type=text],.fld input[type=number],.fld select,.fld textarea,.srow2 input,.srow2 select,.rrow input,.rrow select{border:1px solid var(--line-2);border-radius:7px;background:var(--bg);color:var(--text);font-size:13px;padding:7px 10px}
.fld textarea{resize:vertical;line-height:1.45}
.nums,.nums2{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.nums2{grid-template-columns:1fr 1fr}
.nums label{display:grid;gap:5px;font-size:12px;color:var(--text-3)}
.boxes{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:13px;color:var(--text-2)}
.srow2{display:grid;grid-template-columns:1fr 1.4fr 110px 28px;gap:8px;margin-bottom:8px}
.rrow{display:grid;grid-template-columns:1.2fr 90px 90px 1.2fr 28px;gap:8px;margin-bottom:8px}
.rhead{display:grid;grid-template-columns:1.2fr 90px 90px 1.2fr 28px;gap:8px;font-size:11px;color:var(--text-3);margin-bottom:4px}
.x{width:28px;height:30px;border-radius:7px;color:var(--text-3);text-align:center}
.x:hover{background:var(--hover);color:var(--text)}
.linkbtn{color:var(--accent);font-size:13px}
.path{color:var(--text-3);font-size:12px}
.path b{color:var(--text)}
.preview{color:var(--text-2);font-size:13px;margin-top:6px}
.ffoot{display:flex;align-items:center;gap:16px;padding:20px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.ffoot p{flex:1;color:var(--text-3);font-size:12.5px}
.ffoot .row{display:flex;gap:8px}
.done-card{border:1px solid var(--line);border-radius:10px;padding:18px;margin-top:18px}
.done-card ol{color:var(--text-2);padding-left:18px}

@media (max-width:1000px){
  .app{grid-template-columns:1fr;height:auto}.side{border-right:0;border-top:1px solid var(--line);order:2}.main{overflow:visible}
  .app.proj .side{display:none}
  .stats{grid-template-columns:repeat(2,1fr)}.charts{grid-template-columns:1fr!important}
  .mini{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}
  .wrap,.detail{padding:22px 16px 60px}.vb{grid-template-columns:minmax(0,1fr) 110px}.vb .pair{grid-column:1/-1;order:3}
  .vform{grid-template-columns:1fr 1fr}.fsec{grid-template-columns:1fr;gap:10px}.srow{grid-template-columns:1fr 70px}
  .srow>:nth-child(1),.srow>:nth-child(2),.srow>:nth-child(5){display:none}.srow .a{grid-column:1/-1}
  .taskform{grid-template-columns:1fr 1fr}.taskform .input{grid-column:1/-1}
}
@media (max-width:560px){.crumb,.sync{display:none}.stat .v{font-size:24px}.nums{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header class="bar"><a class="logo" href="#/"><i></i>DrainClamp</a><span class="crumb" id="crumb"></span><span class="sp"></span>
  <span class="sync" id="sync" hidden></span><a class="btn pri" href="#/new">+ New project</a></header>
<div id="root"><p class="muted" style="padding:24px">Loading...</p></div>
<div id="tip" role="tooltip"></div>
<div id="toast" role="status"></div>
<script>
"use strict";
/* Mirrors of dc_project.py constants the page needs to draw forms (drift-checked by t_board.py). */
const AREAS = ["Security", "Data retention", "Guardrails", "Confirmation checks", "Testing"];
const HEALTH = {on: "On track", risk: "At risk", off: "Off track"};
const MOSCOW = ["Must", "Should", "Could", "Won't"];
const LEVELS = ["Low", "Med", "High"];
const DATA_KINDS = ["Personal information", "Financial", "Health", "Credentials or keys", "None of these"];
const CHARTER_TEXT = ["name", "purpose", "sponsor", "stakeholders", "current_state", "objectives",
  "success", "out_of_scope", "milestones", "security", "retention", "assumptions", "never",
  "approvals", "acceptance"];
const DRAFT_KEY = "dc_charter_draft";

  const a = new Date(), b = new Date(d); a.setHours(0, 0, 0, 0); b.setHours(0, 0, 0, 0); return Math.max(0, Math.round((a - b) / 864e5)); };

/* ---------- router ---------- */
async function route() {
  const [page, arg] = location.hash.replace(/^#\/?/, "").split("/");
  S.menu = false; S.taskForm = false; S.form = null;
  if (!TOKEN) return fatal();
  try {
    S.list = await api("/api/projects");
    syncLine();
    if (page === "p" && arg) {
      S.sel = decodeURIComponent(arg);
      S.detail = await api("/api/project?id=" + encodeURIComponent(S.sel));
      renderProject();
    } else if (page === "new") { S.sel = null; renderNew(); }
    else if (page === "sessions") { S.sel = null; S.sessions = await api("/api/effort"); renderSessions(); }
    else { S.sel = null; renderHome(); }
  } catch (e) { fatal(e); }

}
async function reload() {
  S.list = await api("/api/projects");

  if (S.sel) { S.detail = await api("/api/project?id=" + encodeURIComponent(S.sel)); renderProject(); }
  else if (location.hash.startsWith("#/sessions")) { S.sessions = await api("/api/effort"); renderSessions(); }

    : un && un.prompts ? `<div class="notice warn"><div><b>${hrs(un.you_min / 60)} of your time isn't assigned to a project yet</b>
      <span>${un.prompts.toLocaleString("en-AU")} prompts · ${Object.entries(un.hosts || {}).map(([k, v]) => `${k[0].toUpperCase() + k.slice(1)} ${hrs(v / 60)}`).join(" · ")}. Sessions started outside a project folder. Some may not be project work at all.</span></div>
      <a class="btn" href="#/sessions">Review sessions</a><button class="btn" data-act="measure">Measure again</button></div>` : "";

  const m = Math.max(1, ...bars.map(p => Math.max(p.value.annual_cost, p.value.build_cost)));
  const chart = bars.length ? `<div class="charts" style="grid-template-columns:minmax(0,1fr)"><div class="card"><div class="hd"><h3>Value per year vs build cost</h3><small>Projects with manual time</small></div>

      <span class="t" data-tip="<b>${esc(p.name)}</b> · build ${money(p.value.build_cost)}"><b style="width:${100 * p.value.build_cost / m}%;background:var(--s2)"></b></span></span>
      <span class="c num">${money(p.value.annual_cost)}<small>${isNum(p.value.payback_years) ? "pays back in " + months(p.value.payback_years * 12) : ""}</small></span></a>`).join("")}</div></div></div>` : "";
  return `<div class="vhead"><h2>Value</h2><small>Manual time on ${valued.length} of ${all.length} projects · your time from Claude, Codex and Grok · ${rateCtl}</small></div>${cards}${note}${chart}`;
}

      ${isNum(v.annual_cost) && v.annual_cost > 0 && isNum(v.build_cost) && v.build_cost > 0 ? `<div style="margin-top:16px">${breakEven(v.annual_cost, v.build_cost)}</div>` : ""}`;
  }
  return `<div class="sec"><h4>Time and cost</h4>${build}${value}</div>`;
}
function bindProject() {
  const d = S.detail, kind = kindOf(d), rev = () => S.detail.data.rev;
  const setKind = async k => {
    S.menu = false;
    if (k === "done") return write(() => api("/api/status", {id: d.id, rev: rev(), status: "complete"}));
    if (d.status === "complete") { const r = await write(() => api("/api/status", {id: d.id, rev: rev(), status: "active"})); if (!r) return; }
    if (k === "auto" || k === "run" || k === "need") return op("flow.set", {state: k === "auto" ? "auto" : k});
  };
  root.querySelectorAll("[data-set]").forEach(b => b.onclick = e => { e.stopPropagation(); setKind(b.dataset.set); });
  const on = (sel, fn) => root.querySelectorAll(sel).forEach(b => b.addEventListener("click", fn));
  on("[data-act=menu]", e => { e.stopPropagation(); S.menu = !S.menu; renderProject(); });
  on("[data-act=addtask]", () => { S.taskForm = true; renderProject(); root.querySelector("[data-form=task] input")?.focus(); });
  on("[data-act=canceltask]", () => { S.taskForm = false; renderProject(); });
  on("[data-act=update]", () => { S.form = S.form === "update" ? null : "update"; renderProject(); root.querySelector("[data-form=update] input")?.focus(); });
  on("[data-act=outcome]", () => { S.form = "outcome"; renderProject(); root.querySelector("[data-form=outcome] textarea")?.focus(); });
  on("[data-act=timeform]", () => { S.form = S.form === "time" ? null : "time"; renderProject(); root.querySelector("[data-form=time] input")?.focus(); });
  on("[data-act=savingsform]", () => { S.form = "savings"; renderProject(); root.querySelector("[data-form=savings] input")?.focus(); });
  on("[data-act=cancelform]", () => { S.form = null; renderProject(); });
  on("[data-act=confirm]", () => op("outcome.set", {by: "user", confirmed: true}));
  on("[data-act=run]", () => op("run.add", {count: 1}, "Run logged."));
  root.querySelectorAll("[data-act=todo]").forEach(b => b.onchange = () => op(b.checked ? "todo.done" : "todo.undo", {id: b.dataset.id}));
  root.querySelectorAll("form[data-form]").forEach(f => f.addEventListener("submit", async ev => {
    ev.preventDefault();
    if (!f.checkValidity()) { f.reportValidity(); return; }
    const v = n => f.elements[n]?.value ?? "", kind_ = f.dataset.form;
    S.form = null;
    if (kind_ === "task") { S.taskForm = false; return write(() => api("/api/task", {id: d.id, rev: rev(), text: v("text"), owner: v("owner")})); }
    if (kind_ === "update") return op("health.set", {state: v("state"), update: v("update")});
    if (kind_ === "outcome") return op("outcome.set", {text: v("text"), by: "user", confirmed: true});
    if (kind_ === "time") return op("time.add", {minutes: v("minutes"), note: v("note")});
    if (kind_ === "savings") return op("savings.set", {baseline_min: v("baseline_min"), new_min: v("new_min"), runs_per_year: v("freq"), note: ""});
  }));
}

  root.querySelector("[data-act=accept]")?.addEventListener("click", () => write(() => api("/api/effort/assign", {accept: true})));
  root.querySelectorAll("[data-act=measure]").forEach(b => b.onclick = () => { b.disabled = true; write(() => api("/api/effort/refresh", {})); });
  root.querySelectorAll("[data-assign]").forEach(b => b.onclick = () => {
    const sel = root.querySelector(`select[data-key="${CSS.escape(b.dataset.assign)}"]`), pid = sel.value || b.dataset.sug;
    if (!pid) { say("Choose a project first.", true); sel.focus(); return; }
    write(() => api("/api/effort/assign", {items: {[b.dataset.assign]: pid}}));
  });
}

/* ---------- new project (charter) ---------- */
function slugify(name) {
  const s = String(name).toLowerCase().replace(/['\u2019]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  return s.slice(0, 63).replace(/-+$/, "");
}
const TA = (name, label, opt, hint, ph, rows) => `<div class="fld"><label for="f-${name}">${label}${opt ? "<em>optional</em>" : ""}</label>${hint ? `<p class="hint">${hint}</p>` : ""}
  <textarea id="f-${name}" name="${name}" rows="${rows || 3}" maxlength="4000" placeholder="${esc(ph)}" ${opt ? "" : "required"}></textarea></div>`;
const IN = (name, label, hint, ph) => `<div class="fld"><label for="f-${name}">${label}<em>optional</em></label>${hint ? `<p class="hint">${hint}</p>` : ""}
  <input type="text" id="f-${name}" name="${name}" maxlength="4000" placeholder="${esc(ph)}"></div>`;
const SEC = (n, title, why, feeds, body) => `<div class="fsec"><div class="k"><h3><span>${n}</span>${title}</h3><p>${why}</p><p class="feeds">Feeds: ${feeds}</p></div><div class="v">${body}</div></div>`;
const opts = (list, sel) => list.map(x => `<option ${x === sel ? "selected" : ""}>${esc(x)}</option>`).join("");
const scopeRow = (r = {}) => `<div class="srow2"><input type="text" name="feature" maxlength="4000" value="${esc(r.feature)}" placeholder="Feature or deliverable" aria-label="Feature">
  <input type="text" name="what" maxlength="4000" value="${esc(r.what)}" placeholder="What it does" aria-label="What it does">
  <select name="priority" aria-label="Priority">${opts(MOSCOW, r.priority || "Must")}</select><button type="button" class="x" data-act="delrow" aria-label="Remove row">&times;</button></div>`;
const riskRow = (r = {}) => `<div class="rrow"><input type="text" name="risk" maxlength="4000" value="${esc(r.risk)}" placeholder="What could go wrong" aria-label="Risk">
  <select name="likelihood" aria-label="Likelihood">${opts(LEVELS, r.likelihood || "Med")}</select>
  <select name="impact" aria-label="Impact">${opts(LEVELS, r.impact || "Med")}</select>
  <input type="text" name="guardrail" maxlength="4000" value="${esc(r.guardrail)}" placeholder="Guardrail or mitigation" aria-label="Guardrail"><button type="button" class="x" data-act="delrow" aria-label="Remove row">&times;</button></div>`;

function renderNew() {
  document.title = "New project | DrainClamp";
  const roots = S.list.project_roots || [], r = S.list.hourly_rate;
  const main = `<div class="wrap" style="max-width:1080px"><a class="back" href="#/">← Overview</a><h1>New project</h1>
  <p class="sub">A project charter, based on PMI's. Only <b>name</b> and <b>purpose</b> are required. Blanks become questions Claude asks at Gate 1.</p>
  ${roots.length ? "" : `<div class="notice warn"><div><b>No project folders set</b><span>Add the folders new projects may go in to <code>~/.drainclamp/config.json</code>, for example <code>{"project_roots": ["C:\\\\Users\\\\you\\\\Projects"]}</code>, then reload.</span></div></div>`}
  <form class="form" data-form="create" novalidate>
  ${SEC(1, "Project details", "Who owns it and who it's for.", "registry, rundown",
    `<div class="fld"><label for="f-name">Project name</label><input type="text" id="f-name" name="name" required maxlength="4000" placeholder="e.g. Leave Balance Alerts"></div>
     <div class="nums2"><div class="fld"><label for="f-location">Location</label><select id="f-location" name="location">${roots.map(x => `<option value="${esc(x)}">${esc(x)}</option>`).join("")}</select>
       <p class="hint">Only folders listed in ~/.drainclamp/config.json are offered.</p></div>
       <div class="fld"><label for="f-folder">Folder name</label><input type="text" id="f-folder" name="folder" maxlength="63" pattern="[a-z0-9]([a-z0-9-]*[a-z0-9])?" placeholder="from the name">
       <p class="path" id="f-path"></p></div></div>
     <div class="nums2">${IN("sponsor", "Sponsor", "Who asked for it or signs it off?", "e.g. Payroll Manager")}${IN("stakeholders", "Stakeholders", "Who uses it or is affected?", "e.g. People managers, HR, Payroll")}</div>`)}
  ${SEC(2, "Purpose and business case", "Why this project, and why now.", "what it achieves, DC:ARCH",
    TA("purpose", "Purpose", 0, "What does it do, and for whom? One or two sentences.", "e.g. Emails managers when a staff member's leave balance goes over 8 weeks.", 2) +
    TA("current_state", "Current state", 1, "How is it done today, by whom, and what does it cost?", "e.g. Payroll exports balances monthly and checks them by eye in Excel.", 2))}
  ${SEC(3, "Objectives and success criteria", "SMART: specific, measurable, achievable, relevant, time-bound.", "value, DC:ROADMAP exit, Mark complete",
    TA("objectives", "Objectives", 1, "One per line, each with a number and a date.", "Cut the monthly leave check from 90 to 5 minutes by 30 Nov", 3) +
    `<div class="fld"><span class="lbl">Measured value<em>optional</em></span><p class="hint">The baseline for time and cost saved.</p><div class="nums">
      <label>Minutes per run now<input type="number" name="baseline_min" min="0" step="any"></label>
      <label>Minutes after<input type="number" name="new_min" min="0" step="any"></label>
      <label>Runs per year<input type="number" name="runs_per_year" min="0" step="any"></label>
      <label>Hourly rate<input type="number" name="hourly_rate" min="0" step="any" placeholder="${isNum(r) ? "default " + esc(r) : ""}"></label></div></div>
     <p class="preview" id="f-preview" hidden></p>` +
    TA("success", "Success criteria (done means)", 1, "What must be true to mark the project complete?", "e.g. Runs unattended for two months with no missed or wrong alerts.", 2))}
  ${SEC(4, "Scope", "Features ranked with MoSCoW, plus what is deliberately left out.", "DC:ROADMAP milestones, features",
    `<div class="fld"><span class="lbl">In scope<em>optional</em></span><p class="hint">Must = launch fails without it. Won't = agreed not this time.</p>
      <div id="f-scope">${scopeRow()}${scopeRow()}</div><button type="button" class="linkbtn" data-act="addscope">+ Add feature</button></div>` +
    TA("out_of_scope", "Out of scope", 1, "One per line. Stops scope creep later.", "Changing leave balances in payroll", 2))}
  ${SEC(5, "Deliverables and milestones", "The big steps. Claude breaks each into chunks of 25 minutes or less.", "DC:ROADMAP (draft)",
    TA("milestones", "Milestones", 1, "One per line, in order. Leave blank and Claude drafts them from the scope.", "Import and validate the export", 4))}
  ${SEC(6, "Requirements and constraints", "Security, data handling and anything fixed in advance.", "DC:DECISIONS, safeguards",
    `<div class="fld"><span class="lbl">Data it touches<em>optional</em></span><div class="boxes">${DATA_KINDS.map(k => `<label><input type="checkbox" name="data" value="${esc(k)}"> ${esc(k)}</label>`).join("")}</div></div>` +
    TA("security", "Security", 1, "Where are logins or keys kept? Who can open the inputs and outputs?", "e.g. Read-only payroll report; no stored logins.", 2) +
    TA("retention", "Data retention", 1, "What is kept, where, for how long, and what is deleted after each run?", "e.g. Monthly export kept 7 years with payroll records.", 2) +
    TA("assumptions", "Assumptions and constraints", 1, "What are you taking as given? What can't change?", "e.g. Payroll export format stays the same.", 2))}
  ${SEC(7, "Risks and guardrails", "Risk register: what could go wrong, how likely, how bad, and the guardrail that stops it.", "guardrail checks, safeguards",
    `<div class="fld"><span class="lbl">Risks<em>optional</em></span><div class="rhead" aria-hidden="true"><span>RISK</span><span>LIKELIHOOD</span><span>IMPACT</span><span>GUARDRAIL</span><span></span></div>
      <div id="f-risks">${riskRow()}</div><button type="button" class="linkbtn" data-act="addrisk">+ Add risk</button></div>` +
    TA("never", "It must never...", 1, "Hard limits, one per line. Claude writes a check for each.", "change a leave balance", 2))}
  ${SEC(8, "Approvals and confirmation checks", "Who signs off, and which actions need a person to say yes first.", "confirmation checks, Gate 4",
    TA("approvals", "Needs a yes before...", 1, "One per line.", "sending the first batch of alerts each month", 2))}
  ${SEC(9, "Verification and acceptance", "How you'll prove each objective is met.", "DC:VERIFY checks",
    TA("acceptance", "Acceptance tests", 1, "Name the check, sample file or command, one per line.", "Run against the August export: exactly 6 alerts", 3))}
   <div class="ffoot"><p>Creates the folder with git and <span class="mono">.agent/</span>, saves this charter as the brief, and adds the project to the DrainClamp project list.</p>
     <div class="row"><button type="button" class="btn" data-act="draft">Save draft</button><button class="btn pri go" ${roots.length ? "" : "disabled"}>Create project</button></div></div>
  </form><div id="f-done"></div></div>`;
  shell("New project", main);
  const f = root.querySelector("form[data-form=create]");
  restoreDraft(f);
  f.addEventListener("input", () => charterPreview(f));
  f.addEventListener("submit", ev => { ev.preventDefault(); createProject(f); });
  f.addEventListener("click", ev => {
    const el = ev.target.closest("[data-act]");
    if (!el) return;
    const a = el.dataset.act;
    if (a === "addscope") { $("#f-scope").insertAdjacentHTML("beforeend", scopeRow()); $("#f-scope .srow2:last-child input").focus(); }
    if (a === "addrisk") { $("#f-risks").insertAdjacentHTML("beforeend", riskRow()); $("#f-risks .rrow:last-child input").focus(); }
    if (a === "delrow") el.closest(".srow2,.rrow").remove();
    if (a === "draft") {
      store.set(DRAFT_KEY, JSON.stringify({charter: charterFrom(f), location: f.elements.location.value, folder: f.elements.folder.value}));
      say(store.get(DRAFT_KEY) ? "Draft saved in this browser." : "This browser would not save the draft.", !store.get(DRAFT_KEY));
    }
  });
  charterPreview(f);
}
function charterPreview(f) {
  const E = f.elements, folder = E.folder.value.trim() || slugify(E.name.value), loc = E.location?.value || "";
  const sep = loc.includes("\\") ? "\\" : "/";
  $("#f-path").innerHTML = folder ? `${esc(loc.replace(/[\\/]+$/, ""))}${esc(sep)}<b>${esc(folder)}</b>` : "";
  E.folder.placeholder = slugify(E.name.value) || "from the name";
  const n = k => E[k].value === "" ? null : Number(E[k].value);
  const b = n("baseline_min"), a = n("new_min"), runs = n("runs_per_year"), rr = n("hourly_rate") ?? S.list.hourly_rate;
  const pv = $("#f-preview");
  if (isNum(b) && isNum(a) && isNum(runs)) {
    const h = (b - a) * runs / 60;
    pv.innerHTML = `About <b>${hrs(h)}</b>${isNum(rr) ? ` and <b>${money(h * rr)}</b>` : ""} saved a year.`;
    pv.hidden = false;
  } else pv.hidden = true;
}
function charterFrom(f) {
  const E = f.elements, c = {};
  CHARTER_TEXT.forEach(k => { c[k] = (E[k]?.value || "").trim(); });
  const rows = (sel, keys) => [...f.querySelectorAll(sel)].map(r => Object.fromEntries(keys.map(k => [k, r.querySelector(`[name=${k}]`).value.trim()])));
  c.scope = rows(".srow2", ["feature", "what", "priority"]).filter(r => r.feature);
  c.risks = rows(".rrow", ["risk", "likelihood", "impact", "guardrail"]).filter(r => r.risk);
  c.data = [...f.querySelectorAll("[name=data]:checked")].map(x => x.value);
  const n = k => E[k].value === "" ? null : Number(E[k].value);
  c.value = {baseline_min: n("baseline_min"), new_min: n("new_min"), runs_per_year: n("runs_per_year"), hourly_rate: n("hourly_rate")};
  return c;
}
function restoreDraft(f) {
  let dr;
  try { dr = JSON.parse(store.get(DRAFT_KEY) || "null"); } catch { dr = null; }
  if (!dr || typeof dr !== "object") return;
  const c = dr.charter || {}, E = f.elements;
  CHARTER_TEXT.forEach(k => { if (E[k] && typeof c[k] === "string") E[k].value = c[k]; });
  if (typeof dr.folder === "string") E.folder.value = dr.folder;
  if (dr.location && [...E.location.options].some(o => o.value === dr.location)) E.location.value = dr.location;
  if (Array.isArray(c.scope) && c.scope.length) $("#f-scope").innerHTML = c.scope.map(scopeRow).join("") + scopeRow();
  if (Array.isArray(c.risks) && c.risks.length) $("#f-risks").innerHTML = c.risks.map(riskRow).join("") + riskRow();
  (c.data || []).forEach(v => { const box = [...f.querySelectorAll("[name=data]")].find(x => x.value === v); if (box) box.checked = true; });
  Object.entries(c.value || {}).forEach(([k, v]) => { if (E[k] && isNum(v)) E[k].value = v; });
  say("Draft restored.");
}
async function createProject(f) {
  const E = f.elements;
  if (!E.name.value.trim() || !E.purpose.value.trim()) {
    say("Name and purpose are required.", true);
    (E.name.value.trim() ? E.purpose : E.name).focus();
    return;
  }
  if (!f.checkValidity()) { f.reportValidity(); return; }
  const btn = f.querySelector(".go");
  btn.disabled = true;
  try {
    const r = await api("/api/create", {charter: charterFrom(f), location: E.location.value || null, folder: E.folder.value.trim() || null});
    store.set(DRAFT_KEY, null);
    f.hidden = true;
    $("#f-done").innerHTML = `<div class="done-card" role="status"><h3>${esc(r.folder)} created</h3><ol>
      <li>Folder, git repo and <code>.agent/drainclamp-state.md</code> created; the charter saved as <code>.agent/charter.json</code>.</li>
      <li>Added to the DrainClamp project list as active.</li>
      <li>Next: open Claude Code in <code>${esc(r.root)}</code> and run <code>/drainclamp-build-adhd</code>. It reads the charter, drafts the roadmap and checks, and asks only about the blanks.</li></ol>
      <div class="acts"><a class="btn pri" href="#/p/${esc(r.id)}">Open project</a><a class="btn" href="#/">Back to overview</a></div></div>`;
    S.list = await api("/api/projects");
    root.querySelector(".side").innerHTML = sideList(); bindSide();
  } catch (e) { say(esc(e.message), true); btn.disabled = false; }
}

/* ---------- global events ---------- */
const tip = $("#tip");
document.addEventListener("mousemove", e => {
  const t = e.target.closest && e.target.closest("[data-tip]");
  if (!t) { tip.style.display = "none"; return; }
  tip.innerHTML = t.dataset.tip; tip.style.display = "block";
  tip.style.left = Math.min(innerWidth - tip.offsetWidth - 8, e.clientX + 12) + "px"; tip.style.top = (e.clientY - 34) + "px";
});
document.addEventListener("click", e => { if (S.menu && !e.target.closest(".smenu")) { S.menu = false; renderProject(); } });
document.addEventListener("keydown", e => {
  if (e.key === "Escape") {
    if (S.menu || S.taskForm || S.form) { S.menu = false; S.taskForm = false; S.form = null; if (S.sel) renderProject(); else if (!location.hash.match(/^#\/(new|sessions)/)) renderHome(); }
    return;
  }
  if (e.key === "/" && !e.target.closest("input,textarea,select")) { e.preventDefault(); $("#q")?.focus(); }
});
addEventListener("hashchange", route);
route();
</script>
